# SPDX-License-Identifier: GPL-3.0-or-later
# Compila el instalador de Windows desde el código fuente y lo publica en el Release.
# Se dispara al subir una etiqueta vX.Y.Z (git tag v0.5.0 && git push origin v0.5.0) o al subir a main
# main con una versión nueva en app/__init__.py: si la etiqueta de esa versión no existe, la crea y publica.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.d.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          v=$(python3 -c "import app; print(app.__version__)")
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "La versión v$v ya está publicada: no se hace nada."; echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versión nueva v$v: se compila y publica."; echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest httpx

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = python -c "import app; print(app.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con la versión v$v de app/__init__.py"; exit 1
          }

      - name: Ejecutable (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging\presupuestos.spec

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Huella SHA-256
        shell: pwsh
        run: |
          $f = "packaging\Output\Presupuestos-Setup-${{ steps.version.outputs.version }}.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  Presupuestos-Setup-${{ steps.version.outputs.version }}.exe" | Out-File -Encoding ascii "$f.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ steps.version.outputs.version }}
          path: |
            packaging/Output/*.exe
            packaging/Output/*.sha256
            docs/Manual_Presupuestos.pdf

      - name: Publicar en el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Presupuestos ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packaging/Output/Presupuestos-Setup-${{ steps.version.outputs.version }}.exe
            packaging/Output/Presupuestos-Setup-${{ steps.version.outputs.version }}.exe.sha256
            docs/Manual_Presupuestos.pdf
